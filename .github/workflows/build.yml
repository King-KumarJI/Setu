name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Setu.exe (runs the test suite as a build gate)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Compute SHA256 checksum
        shell: powershell
        run: |
          $hash = Get-FileHash -Path dist\Setu.exe -Algorithm SHA256
          "$($hash.Hash)  Setu.exe" | Out-File -Encoding ascii dist\Setu.exe.sha256
          Get-Content dist\Setu.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setu-windows
          path: |
            dist\Setu.exe
            dist\Setu.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Setu.exe (runs the test suite as a build gate)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Compute SHA256 checksum
        shell: powershell
        run: |
          $hash = Get-FileHash -Path dist\Setu.exe -Algorithm SHA256
          "$($hash.Hash)  Setu.exe" | Out-File -Encoding ascii dist\Setu.exe.sha256
          Get-Content dist\Setu.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Setu.exe
            dist/Setu.exe.sha256
          generate_release_notes: true
